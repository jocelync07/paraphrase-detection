name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests cover features and metrics only, so they need no models or downloads.
      - run: pip install numpy scikit-learn pytest
      - run: pytest -v
